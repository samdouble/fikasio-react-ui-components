name: Checks

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ['24.18.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
      - name: Visual Regression Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwoff1 libharfbuzz-icu0 \
            libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libgstreamer1.0-0 \
            libegl1 libopus0 libxslt1.1 libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-good1.0-0 libenchant-2-2 libsecret-1-0 \
            libhyphen0 libmanette-0.2-0
          npx playwright install
          npm run test-ct
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-snapshots
          path: test-results
      - name: Build
        run: |
          npm run build
