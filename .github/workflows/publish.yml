name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: ['24.18.0']
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify tarball includes dist
        run: |
          npm pack --dry-run --json | node --input-type=module -e '
            const chunks = [];
            for await (const chunk of process.stdin) chunks.push(chunk);
            const pack = JSON.parse(Buffer.concat(chunks).toString());
            const files = (Array.isArray(pack) ? pack[0] : pack).files.map((f) => f.path);
            const required = ["dist/index.js", "dist/index.mjs"];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("Package tarball is missing:", missing.join(", "));
              console.error("Packed files:\n" + files.map((f) => `  ${f}`).join("\n"));
              process.exit(1);
            }
            console.log("Tarball includes required dist files.");
          '
      - name: Publish
        env:
          NPM_API_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: |
          npm set //registry.npmjs.org/:_authToken $NPM_API_TOKEN
          npm publish --access=public
